name: AD BLOCK APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android projesini hazirla
        run: flutter create --platforms=android .

      - name: Paketleri yukle
        run: flutter pub get

      - name: APK olustur
        run: flutter build apk --release

      - name: Android klasorunu kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Android projesini ekle
          file_pattern: android/** .gitignore .metadata analysis_options.yaml pubspec.lock test/**

      - name: APK kaydet
        uses: actions/upload-artifact@v4
        with:
          name: AD-BLOCK-APK
          path: build/app/outputs/flutter-apk/app-release.apk
